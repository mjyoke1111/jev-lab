name: Laya CPU consistency sanity run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laya-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_TF: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
    steps:
      - name: Check out locked protocol
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install official CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install laya==0.3.4 --no-deps
          python -m pip install transformers huggingface_hub numpy safetensors

      - name: Run locked 12-case Laya artifact
        run: |
          python harness/consistency/run-laya.py \
            --cases harness/consistency/cases.json \
            --out harness/results/consistency-laya.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Evaluate locked metrics
        run: |
          npm ci --ignore-scripts
          npm run consistency:score -- \
            --predictions harness/results/consistency-laya.json \
            --out harness/results/consistency-laya-report.json

      - name: Record provenance
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          import laya,torch,transformers
          files=['harness/consistency/cases.json','harness/consistency/run-laya.py','harness/consistency/evaluate.ts']
          record={
            'gitCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'python':platform.python_version(),'torch':torch.__version__,
            'transformers':transformers.__version__,'laya':getattr(laya,'__version__','unknown'),
            'device':'cpu','files':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},
            'claimStatus':'review-only; not published benchmark evidence'
          }
          Path('harness/results/consistency-laya-provenance.json').write_text(json.dumps(record,indent=2)+'\n')
          PY

      - name: Upload review-only evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: laya-consistency-review-${{ github.run_id }}
          path: |
            harness/results/consistency-laya.json
            harness/results/consistency-laya-report.json
            harness/results/consistency-laya-provenance.json
          if-no-files-found: error
          retention-days: 14
