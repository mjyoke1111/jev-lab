name: Laya absolute vs tournament review run
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  laya-tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_TF: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install official CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install laya==0.3.4 --no-deps
          python -m pip install transformers huggingface_hub numpy safetensors
      - name: Run preregistered experiment
        run: python harness/tournament/run-laya.py --out harness/results/tournament-laya.json
      - name: Record provenance
        run: |
          python - <<'PY'
          import hashlib,json,platform,subprocess
          from pathlib import Path
          import laya,torch,transformers
          files=['harness/tournament/protocol.json','harness/tournament/run-laya.py']
          row={'gitCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'python':platform.python_version(),'torch':torch.__version__,'transformers':transformers.__version__,'laya':getattr(laya,'__version__','unknown'),'device':'cpu','files':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},'claimStatus':'review-only; not published evidence'}
          Path('harness/results/tournament-laya-provenance.json').write_text(json.dumps(row,indent=2)+'\n')
          PY
      - name: Upload review-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: laya-tournament-review-${{ github.run_id }}
          path: |
            harness/results/tournament-laya.json
            harness/results/tournament-laya-provenance.json
          if-no-files-found: error
          retention-days: 14
