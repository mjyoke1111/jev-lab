<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentproof audit - exactly where your agent breaks, in 48 hours</title>
<meta name="description" content="A 48-hour evaluation audit for AI agents: 120 test cases against your endpoint, a prioritized failure list, and a CI gate wired into your repo. Founding pilot at AU$149.">
<style>
  :root { --bg:#0b0e14; --fg:#e6e9ef; --dim:#9aa4b2; --accent:#4ade80; --card:#131824; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:64px 24px; }
  h1 { font-size:40px; line-height:1.15; letter-spacing:-0.02em; }
  h1 span { color:var(--accent); }
  .sub { color:var(--dim); font-size:19px; margin:20px 0 32px; }
  .cta { display:inline-block; background:var(--accent); color:#0b0e14; font-weight:600;
         padding:14px 28px; border-radius:10px; text-decoration:none; }
  .cta2 { display:inline-block; color:var(--fg); border:1px solid #2a3342;
          padding:14px 28px; border-radius:10px; text-decoration:none; margin-left:12px; }
  .card { background:var(--card); border:1px solid #1f2635; border-radius:14px; padding:24px; margin-top:40px; }
  .card h2 { font-size:20px; margin-bottom:12px; }
  ul { padding-left:20px; color:var(--dim); }
  li { margin:6px 0; }
  code { background:#1a2130; padding:2px 7px; border-radius:6px; font-size:14px; }
  pre { background:#0f141d; border:1px solid #1f2635; border-radius:10px; padding:16px;
        overflow-x:auto; font-size:14px; margin-top:12px; }
  .price { font-size:32px; font-weight:700; margin:8px 0 4px; }
  .strike { color:var(--dim); text-decoration:line-through; font-size:20px; font-weight:400; margin-left:8px; }
  .fine { color:var(--dim); font-size:14px; margin-top:6px; }
  .q { color:var(--fg); font-weight:600; margin-top:14px; }
  footer { color:var(--dim); font-size:13px; margin-top:56px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Exactly where your agent breaks. <span>In 48 hours.</span></h1>
